<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Interview Practice — JTG Placement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-2: #1e2230;
      --border: #2a3042;
      --text: #e8eaf0;
      --muted: #8b93a7;
      --accent: #6c8cff;
      --accent-dim: rgba(108, 140, 255, 0.12);
      --success: #34d399;
      --success-dim: rgba(52, 211, 153, 0.12);
      --error: #f87171;
      --error-dim: rgba(248, 113, 113, 0.12);
      --warning: #fbbf24;
      --code-bg: #12151c;
      --radius: 12px;
      --sidebar-w: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }

    .main-column {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1.25rem 1rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .sidebar-header p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .progress-bar-wrap {
      margin-top: 0.875rem;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .progress-track {
      height: 6px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #9b7bff);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .sidebar-controls {
      padding: 0.75rem 1rem;
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-controls select,
    .sidebar-controls button {
      font-family: inherit;
      font-size: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      cursor: pointer;
    }

    .sidebar-controls button:hover { border-color: var(--accent); color: var(--accent); }

    .question-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .category-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0.75rem 0.5rem 0.35rem;
    }

    .q-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.6rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .q-item:hover { background: var(--surface-2); }
    .q-item.active { background: var(--accent-dim); color: var(--accent); }

    .q-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--border);
    }

    .q-status.correct { background: var(--success); }
    .q-status.wrong { background: var(--error); }

    .q-id { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; }

    /* Main */
    .main {
      flex: 1;
      padding: 2rem 2.5rem;
      max-width: 900px;
      overflow-y: auto;
    }

    .question-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      background: var(--accent-dim);
      color: var(--accent);
    }

    .badge.mcq { background: rgba(251, 191, 36, 0.15); color: var(--warning); }

    .question-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }

    .code-block {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
    }

    .code-block pre {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      color: #c9d1d9;
      white-space: pre;
    }

    .prompt {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .answer-area textarea {
      width: 100%;
      min-height: 120px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 1rem 1.15rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    .answer-area textarea:focus { border-color: var(--accent); }
    .answer-area textarea:disabled { opacity: 0.6; cursor: not-allowed; }

    .mcq-options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .mcq-option {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .mcq-option:hover { border-color: var(--accent); }
    .mcq-option.selected { border-color: var(--accent); background: var(--accent-dim); }
    .mcq-option input { margin-top: 0.2rem; accent-color: var(--accent); }
    .mcq-option .opt-label {
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      min-width: 1.25rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    .btn {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }

    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--muted); }
    .btn-danger { background: var(--error-dim); color: var(--error); border: 1px solid rgba(248, 113, 113, 0.35); }
    .btn-danger:hover { background: rgba(248, 113, 113, 0.2); }

    .reset-all-wrap {
      margin-top: 0.75rem;
    }

    .reset-all-wrap button {
      width: 100%;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: var(--error-dim);
      color: var(--error);
      cursor: pointer;
    }

    .reset-all-wrap button:hover {
      background: rgba(248, 113, 113, 0.2);
    }

    .result {
      margin-top: 1.5rem;
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      display: none;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result.show { display: block; }
    .result.correct { background: var(--success-dim); border: 1px solid rgba(52, 211, 153, 0.3); }
    .result.incorrect { background: var(--error-dim); border: 1px solid rgba(248, 113, 113, 0.3); }

    .result-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .result.correct .result-header { color: var(--success); }
    .result.incorrect .result-header { color: var(--error); }

    .result-section { margin-top: 1rem; }
    .result-section h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .result-section pre,
    .result-section .markdown-body {
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .markdown-body ul { list-style: none; padding: 0; }
    .markdown-body li {
      position: relative;
      padding-left: 1rem;
      margin-bottom: 0.35rem;
    }
    .markdown-body li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--accent);
    }
    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(108,140,255,0.15);
      padding: 0.1em 0.35em;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .markdown-body strong { color: var(--text); }

    .nav-footer {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-footer span { font-size: 0.8rem; color: var(--muted); }

    /* Mobile top bar (hidden on desktop) */
    .mobile-topbar {
      display: none;
      flex-shrink: 0;
    }

    .sidebar-overlay {
      display: none;
    }

    .sidebar-close {
      display: none;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .main-column {
        min-height: 100dvh;
      }

      .mobile-topbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 0.75rem 1rem;
        padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      .menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-2);
        color: var(--text);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .menu-btn svg {
        width: 22px;
        height: 22px;
      }

      .mobile-topbar-title {
        flex: 1;
        min-width: 0;
        font-size: 0.9rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .mobile-topbar-count {
        font-size: 0.75rem;
        color: var(--muted);
        font-family: 'JetBrains Mono', monospace;
        flex-shrink: 0;
      }

      .sidebar-overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 150;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      body.sidebar-open .sidebar-overlay {
        opacity: 1;
        pointer-events: auto;
      }

      body.sidebar-open {
        overflow: hidden;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(300px, 88vw);
        max-width: 100%;
        z-index: 200;
        height: 100vh;
        height: 100dvh;
        transform: translateX(-100%);
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        border-right: 1px solid var(--border);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      .sidebar-close {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        top: calc(0.75rem + env(safe-area-inset-top, 0px));
        width: 40px;
        height: 40px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text);
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        z-index: 1;
        -webkit-tap-highlight-color: transparent;
      }

      .sidebar-header {
        padding-right: 3rem;
        padding-top: calc(1.25rem + env(safe-area-inset-top, 0px));
      }

      .question-list {
        max-height: none;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .main {
        flex: 1;
        padding: 1rem;
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
        max-width: 100%;
        min-width: 0;
      }

      .question-title {
        font-size: 1.2rem;
        margin-bottom: 1rem;
        line-height: 1.35;
      }

      .code-block {
        padding: 1rem;
        margin-bottom: 1rem;
        -webkit-overflow-scrolling: touch;
      }

      .code-block pre {
        font-size: 0.72rem;
        line-height: 1.6;
      }

      .answer-area textarea {
        font-size: 16px; /* prevents iOS zoom on focus */
        min-height: 100px;
        padding: 0.85rem 1rem;
      }

      .mcq-option {
        padding: 1rem;
        min-height: 48px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .actions .btn {
        min-height: 44px;
        padding: 0.75rem 1rem;
        font-size: 0.8125rem;
      }

      .actions .btn-primary {
        grid-column: 1 / -1;
      }

      .nav-footer {
        flex-direction: column;
        gap: 0.65rem;
        margin-top: 1.5rem;
        padding-top: 1.25rem;
      }

      .nav-footer .btn {
        width: 100%;
        min-height: 44px;
      }

      .nav-footer span {
        order: -1;
        text-align: center;
        width: 100%;
        padding-bottom: 0.25rem;
      }

      .result {
        padding: 1rem;
      }

      .result-section pre,
      .result-section .markdown-body {
        font-size: 0.75rem;
        padding: 0.75rem;
      }

      .sidebar-controls {
        flex-wrap: wrap;
      }

      .sidebar-controls select {
        flex: 1 1 100%;
        min-height: 44px;
        font-size: 16px;
      }

      .sidebar-controls button {
        flex: 1;
        min-height: 44px;
      }

      .q-item {
        padding: 0.65rem 0.75rem;
        min-height: 44px;
        font-size: 0.8rem;
      }

      .reset-all-wrap button {
        min-height: 44px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .main {
        padding: 0.85rem;
      }

      .question-meta {
        gap: 0.4rem;
      }

      .badge {
        font-size: 0.62rem;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .actions .btn-primary {
        grid-column: 1;
      }

      .prompt {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Close question list">×</button>
      <div class="sidebar-header">
        <h1>JS Interview Practice</h1>
        <p>JTG Placement Drive</p>
        <div class="progress-bar-wrap">
          <div class="progress-label">
            <span>Progress</span>
            <span id="progress-text">0 / 0</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
          </div>
        </div>
        <div class="reset-all-wrap">
          <button id="reset-all-btn" type="button">Reset All Progress</button>
        </div>
      </div>
      <div class="sidebar-controls">
        <select id="filter-category" title="Filter by category">
          <option value="all">All topics</option>
        </select>
        <button id="shuffle-btn" title="Random question">Shuffle</button>
      </div>
      <div class="question-list" id="question-list"></div>
    </aside>

    <div class="main-column">
      <header class="mobile-topbar" id="mobile-topbar">
        <button type="button" class="menu-btn" id="menu-toggle" aria-label="Open question list" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <span class="mobile-topbar-title" id="mobile-topbar-title">JS Interview Practice</span>
        <span class="mobile-topbar-count" id="mobile-topbar-count">1 / 42</span>
      </header>
      <main class="main" id="main-content">
        <p style="color: var(--muted)">Loading questions…</p>
      </main>
    </div>
  </div>

  <script src="questions-data.js?v=2"></script>
  <script>
    const STORAGE_KEY = 'js-practice-progress';

    let currentIndex = 0;
    let filteredQuestions = [...QUESTIONS];
    let progress = loadProgress();

    function updateMobileHeader() {
      const q = filteredQuestions[currentIndex];
      const titleEl = document.getElementById('mobile-topbar-title');
      const countEl = document.getElementById('mobile-topbar-count');
      if (titleEl && q) {
        titleEl.textContent = `Q ${q.id}: ${q.title}`;
      }
      if (countEl) {
        countEl.textContent = `${currentIndex + 1} / ${filteredQuestions.length}`;
      }
    }

    function openSidebar() {
      document.body.classList.add('sidebar-open');
      const toggle = document.getElementById('menu-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'true');
      document.getElementById('sidebar-overlay')?.setAttribute('aria-hidden', 'false');
    }

    function closeSidebar() {
      document.body.classList.remove('sidebar-open');
      const toggle = document.getElementById('menu-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
      document.getElementById('sidebar-overlay')?.setAttribute('aria-hidden', 'true');
    }

    function isMobileLayout() {
      return window.matchMedia('(max-width: 900px)').matches;
    }

    function loadProgress() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      updateProgressBar();
    }

    function getCategories() {
      return [...new Set(QUESTIONS.map(q => q.category))];
    }

    function normalizeLine(line) {
      return line
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .replace(/[""]/g, '"')
        .replace(/['']/g, "'")
        .replace(/\s*\([^)]*\)\s*$/g, '')
        .replace(/\s*\/\/.*$/, '')
        .trim();
    }

    function getComparableLines(text) {
      if (!text) return [];
      return text
        .split('\n')
        .map(normalizeLine)
        .filter(line => line && !line.startsWith('//'));
    }

    function splitAlternatives(expected) {
      return expected.split(/\s*\([^)]*or[^)]*\)/i).map(s => s.trim()).filter(Boolean);
    }

    function linesMatch(userLines, expectedLines) {
      if (userLines.length === 0) return false;

      const coreExpected = expectedLines.filter(l =>
        !/^\(.*\)$/.test(l) && !l.includes('printed after') && !l.includes('after 1 second')
      );

      const coreUser = userLines.filter(l => !/^\(.*\)$/.test(l));

      if (coreExpected.length === 0) {
        return userLines.some(u => expectedLines.some(e => e.includes(u) || u.includes(e)));
      }

      if (coreUser.length !== coreExpected.length) {
        const userJoined = coreUser.join(' ');
        const expJoined = coreExpected.join(' ');
        if (userJoined === expJoined) return true;
        if (coreUser.length < coreExpected.length) {
          return coreExpected.every((e, i) => coreUser[i] && (coreUser[i] === e || e.includes(coreUser[i]) || coreUser[i].includes(e)));
        }
        return false;
      }

      return coreExpected.every((exp, i) => {
        const user = coreUser[i];
        if (user === exp) return true;
        if (exp.includes(' or ')) {
          return exp.split(/\s+or\s+/).some(alt => user.includes(normalizeLine(alt)) || normalizeLine(alt).includes(user));
        }
        return exp.includes(user) || user.includes(exp);
      });
    }

    function checkAnswer(question, userAnswer) {
      if (question.type === 'mcq') {
        return userAnswer.trim().toUpperCase() === question.correctAnswer?.trim().toUpperCase();
      }

      const expected = question.expectedOutput || '';
      const alternatives = splitAlternatives(expected);

      for (const alt of alternatives.length ? alternatives : [expected]) {
        const userLines = getComparableLines(userAnswer);
        const expectedLines = getComparableLines(alt);

        if (linesMatch(userLines, expectedLines)) return true;

        const userNorm = userLines.join('\n');
        const expNorm = expectedLines.join('\n');
        if (userNorm && expNorm && (userNorm.includes(expNorm) || expNorm.includes(userNorm))) return true;
      }

      return false;
    }

    function renderMarkdown(text) {
      if (!text) return '';
      let html = text
        .replace(/```(?:javascript|js)?\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

      const lines = html.split('\n');
      const parts = [];
      let inList = false;

      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('- ')) {
          if (!inList) { parts.push('<ul>'); inList = true; }
          parts.push(`<li>${trimmed.slice(2)}</li>`);
        } else {
          if (inList) { parts.push('</ul>'); inList = false; }
          if (trimmed.startsWith('<pre>') || trimmed.startsWith('<')) {
            parts.push(trimmed);
          } else if (trimmed) {
            parts.push(`<p>${trimmed}</p>`);
          }
        }
      }
      if (inList) parts.push('</ul>');
      return parts.join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function updateProgressBar() {
      const answered = Object.keys(progress).length;
      const correct = Object.values(progress).filter(p => p.correct).length;
      const total = QUESTIONS.length;
      const pct = total ? (answered / total) * 100 : 0;

      document.getElementById('progress-text').textContent = `${correct} correct · ${answered}/${total}`;
      document.getElementById('progress-fill').style.width = `${pct}%`;
    }

    function populateCategoryFilter() {
      const select = document.getElementById('filter-category');
      getCategories().forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function renderQuestionList() {
      const list = document.getElementById('question-list');
      list.innerHTML = '';

      let lastCat = '';
      filteredQuestions.forEach((q, idx) => {
        if (q.category !== lastCat) {
          lastCat = q.category;
          const label = document.createElement('div');
          label.className = 'category-label';
          label.textContent = q.category;
          list.appendChild(label);
        }

        const btn = document.createElement('button');
        btn.className = 'q-item' + (idx === currentIndex ? ' active' : '');
        btn.dataset.index = idx;

        const status = document.createElement('span');
        status.className = 'q-status';
        if (progress[q.id]) {
          status.classList.add(progress[q.id].correct ? 'correct' : 'wrong');
        }

        btn.innerHTML = `<span class="q-id">${q.id}</span> ${escapeHtml(q.title)}`;
        btn.prepend(status);
        btn.addEventListener('click', () => {
          currentIndex = idx;
          renderQuestion();
          renderQuestionList();
          if (isMobileLayout()) closeSidebar();
        });
        list.appendChild(btn);
      });
    }

    function renderQuestion() {
      const q = filteredQuestions[currentIndex];
      if (!q) return;

      const main = document.getElementById('main-content');
      const saved = progress[q.id];
      const isMcq = q.type === 'mcq' && q.options?.length;

      main.innerHTML = `
        <div class="question-meta">
          <span class="badge">${escapeHtml(q.category)}</span>
          <span class="badge">${isMcq ? 'MCQ' : 'Output Prediction'}</span>
          <span class="badge">Q ${q.id}</span>
        </div>
        <h2 class="question-title">${escapeHtml(q.title)}</h2>

        <div class="code-block">
          <pre>${escapeHtml(q.code)}</pre>
        </div>

        <p class="prompt">${isMcq ? 'Select the correct answer:' : 'What will be the console output? (one value per line)'}</p>

        <div class="answer-area">
          ${isMcq ? renderMcqOptions(q, saved) : `
            <textarea id="user-answer" placeholder="Type your answer here…&#10;e.g.&#10;undefined&#10;5" ${saved ? 'disabled' : ''}>${saved?.answer || ''}</textarea>
          `}
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="submit-btn" ${saved ? 'disabled' : ''}>Submit Answer</button>
          <button class="btn btn-secondary" id="retry-btn" style="display:${saved ? 'inline-block' : 'none'}">Try Again</button>
          <button class="btn btn-secondary" id="show-answer-btn" style="display:${saved ? 'none' : 'inline-block'}">Reveal Answer</button>
          <button class="btn btn-danger" id="reset-question-btn" type="button">Reset</button>
        </div>

        <div class="result" id="result-panel"></div>

        <div class="nav-footer">
          <button class="btn btn-secondary" id="prev-btn" ${currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
          <span>${currentIndex + 1} of ${filteredQuestions.length}</span>
          <button class="btn btn-secondary" id="next-btn" ${currentIndex >= filteredQuestions.length - 1 ? 'disabled' : ''}>Next →</button>
        </div>
      `;

      if (saved) showResult(q, saved.correct, saved.answer, true);

      document.getElementById('submit-btn')?.addEventListener('click', () => submitAnswer(q));
      document.getElementById('retry-btn')?.addEventListener('click', () => retryQuestion(q));
      document.getElementById('show-answer-btn')?.addEventListener('click', () => revealAnswer(q));
      document.getElementById('reset-question-btn')?.addEventListener('click', () => resetCurrentQuestion(q));
      document.getElementById('prev-btn')?.addEventListener('click', () => navigate(-1));
      document.getElementById('next-btn')?.addEventListener('click', () => navigate(1));

      if (isMcq) {
        document.querySelectorAll('.mcq-option').forEach(opt => {
          opt.addEventListener('click', () => {
            if (progress[q.id]) return;
            document.querySelectorAll('.mcq-option').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            opt.querySelector('input').checked = true;
          });
        });
      }

      updateMobileHeader();
    }

    function renderMcqOptions(q, saved) {
      return `<div class="mcq-options">${q.options.map(opt => `
        <label class="mcq-option ${saved?.answer === opt.label ? 'selected' : ''}">
          <input type="radio" name="mcq" value="${opt.label}" ${saved?.answer === opt.label ? 'checked' : ''} ${saved ? 'disabled' : ''} />
          <span class="opt-label">${opt.label})</span>
          <span>${escapeHtml(opt.text)}</span>
        </label>
      `).join('')}</div>`;
    }

    function getUserAnswer(q) {
      if (q.type === 'mcq') {
        const selected = document.querySelector('input[name="mcq"]:checked');
        return selected ? selected.value : '';
      }
      return document.getElementById('user-answer')?.value.trim() || '';
    }

    function submitAnswer(q) {
      const answer = getUserAnswer(q);
      if (!answer) {
        alert('Please enter or select an answer first.');
        return;
      }

      const correct = checkAnswer(q, answer);
      progress[q.id] = { correct, answer, timestamp: Date.now() };
      saveProgress();

      document.getElementById('user-answer') && (document.getElementById('user-answer').disabled = true);
      document.querySelectorAll('input[name="mcq"]').forEach(i => i.disabled = true);
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('show-answer-btn').style.display = 'none';
      document.getElementById('retry-btn').style.display = 'inline-block';

      showResult(q, correct, answer, false);
      renderQuestionList();
    }

    function showResult(q, correct, userAnswer, fromSaved) {
      const panel = document.getElementById('result-panel');
      panel.className = `result show ${correct ? 'correct' : 'incorrect'}`;

      const expectedDisplay = q.type === 'mcq'
        ? `${q.correctAnswer}) ${q.options?.find(o => o.label === q.correctAnswer)?.text || ''}`
        : (q.expectedOutput || 'See explanation');

      let html = `
        <div class="result-header">${correct ? '✓ Correct!' : '✗ Incorrect'}</div>
      `;

      if (!correct || fromSaved) {
        if (!correct) {
          html += `
            <div class="result-section">
              <h4>Your answer</h4>
              <pre>${escapeHtml(userAnswer || '(empty)')}</pre>
            </div>
            <div class="result-section">
              <h4>Correct answer</h4>
              <pre>${escapeHtml(expectedDisplay)}</pre>
            </div>
          `;
        }

        html += `
          <div class="result-section">
            <h4>Explanation</h4>
            <div class="markdown-body">${renderMarkdown(q.explanation)}</div>
          </div>
        `;

        if (q.keyConcepts) {
          html += `
            <div class="result-section">
              <h4>Key concepts</h4>
              <div class="markdown-body">${renderMarkdown(q.keyConcepts)}</div>
            </div>
          `;
        }

        if (q.howToFix) {
          html += `
            <div class="result-section">
              <h4>How to fix</h4>
              <div class="markdown-body">${renderMarkdown(q.howToFix)}</div>
            </div>
          `;
        }
      } else {
        html += `<p style="color: var(--success); font-size: 0.9rem;">Great job! Move on to the next question.</p>`;
        if (q.keyConcepts) {
          html += `
            <div class="result-section">
              <h4>Key concepts</h4>
              <div class="markdown-body">${renderMarkdown(q.keyConcepts)}</div>
            </div>
          `;
        }
      }

      panel.innerHTML = html;
    }

    function revealAnswer(q) {
      const expected = q.type === 'mcq'
        ? q.correctAnswer
        : q.expectedOutput;

      if (q.type === 'mcq') {
        document.querySelector(`input[value="${q.correctAnswer}"]`)?.click();
      } else {
        const ta = document.getElementById('user-answer');
        if (ta) ta.value = expected;
      }
    }

    function retryQuestion(q) {
      delete progress[q.id];
      saveProgress();
      renderQuestion();
      renderQuestionList();
    }

    function resetAllProgress() {
      if (confirm('Reset all progress? This will clear every answered question.')) {
        progress = {};
        saveProgress();
        renderQuestionList();
        renderQuestion();
      }
    }

    function resetCurrentQuestion(q) {
      delete progress[q.id];
      saveProgress();
      renderQuestion();
      renderQuestionList();
    }

    function navigate(dir) {
      currentIndex = Math.max(0, Math.min(filteredQuestions.length - 1, currentIndex + dir));
      renderQuestion();
      renderQuestionList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function applyFilter(category) {
      filteredQuestions = category === 'all'
        ? [...QUESTIONS]
        : QUESTIONS.filter(q => q.category === category);
      currentIndex = 0;
      renderQuestionList();
      renderQuestion();
      if (isMobileLayout()) closeSidebar();
    }

    function initSidebarMobile() {
      document.getElementById('menu-toggle')?.addEventListener('click', openSidebar);
      document.getElementById('sidebar-close')?.addEventListener('click', closeSidebar);
      document.getElementById('sidebar-overlay')?.addEventListener('click', closeSidebar);

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.body.classList.contains('sidebar-open')) {
          closeSidebar();
        }
      });

      window.addEventListener('resize', () => {
        if (!isMobileLayout()) closeSidebar();
      });
    }

    function init() {
      populateCategoryFilter();
      updateProgressBar();
      renderQuestionList();
      renderQuestion();
      initSidebarMobile();

      document.getElementById('filter-category').addEventListener('change', e => {
        applyFilter(e.target.value);
      });

      document.getElementById('shuffle-btn').addEventListener('click', () => {
        currentIndex = Math.floor(Math.random() * filteredQuestions.length);
        renderQuestion();
        renderQuestionList();
        if (isMobileLayout()) closeSidebar();
      });

      document.getElementById('reset-all-btn').addEventListener('click', resetAllProgress);

      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight') navigate(1);
        if (e.key === 'ArrowLeft') navigate(-1);
      });
    }

    init();
  </script>
</body>
</html>
